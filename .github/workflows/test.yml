name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-base-private-dev \
            liblingmoplugin-dev liblingmoconfig-dev \
            liblingmoispc-dev liblingmoutils-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_APPLETS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel 4
